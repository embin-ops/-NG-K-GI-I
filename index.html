<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Custom Em Bin - Đăng ký</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #070b14, #111827);
  color: white;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 750px;
  margin: auto;
}

.header {
  text-align: center;
  padding: 25px 10px;
}

.header h1 {
  font-size: 34px;
  color: #00e5ff;
  margin-bottom: 8px;
}

.header p {
  color: #aaa;
}

.counter {
  background: #151b2b;
  border: 1px solid #26324a;
  border-radius: 18px;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
}

.counter-title {
  color: #aaa;
  margin-bottom: 8px;
}

.counter-number {
  font-size: 30px;
  font-weight: bold;
  color: #00e5ff;
}

.counter-number.full {
  color: #ff5555;
}

.card {
  background: #151b2b;
  border: 1px solid #26324a;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
}

.card h2 {
  color: #00e5ff;
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
select {
  width: 100%;
  padding: 14px;
  margin-bottom: 17px;
  border-radius: 10px;
  border: 1px solid #303b55;
  background: #0c1220;
  color: white;
  font-size: 15px;
}

.member {
  background: #0e1524;
  border: 1px solid #2b3852;
  border-radius: 14px;
  padding: 17px;
  margin-bottom: 15px;
}

.member h3 {
  color: #ffd166;
  margin-bottom: 15px;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  background: #00e5ff;
  color: #001016;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.message {
  display: none;
  padding: 18px;
  margin-top: 20px;
  border-radius: 12px;
  text-align: center;
}

.success {
  background: #12351f;
  border: 1px solid #28d66b;
  color: #8cffae;
}

.error {
  background: #3a1515;
  border: 1px solid #ff5555;
  color: #ff9a9a;
}

.footer {
  text-align: center;
  color: #666;
  margin-top: 25px;
  font-size: 13px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>🏆 CUSTOM EM BIN</h1>
  <p>ĐĂNG KÝ GIẢI ĐẤU - TỐI ĐA 24 TEAM</p>
</div>

<div class="counter">

  <div class="counter-title">
    SỐ TEAM ĐÃ ĐĂNG KÝ
  </div>

  <div id="counter"
       class="counter-number">
    Đang kiểm tra...
  </div>

</div>

<form id="registerForm">

<div class="card">

<h2>📝 THÔNG TIN ĐỘI</h2>

<label>Tên Team</label>

<input
  type="text"
  name="teamName"
  placeholder="Nhập tên team"
  required
>

<label>Tên đội trưởng</label>

<input
  type="text"
  name="captain"
  placeholder="Nhập tên đội trưởng"
  required
>

<label>Số điện thoại / Zalo</label>

<input
  type="text"
  name="contact"
  placeholder="Nhập SĐT hoặc Zalo"
  required
>

</div>

<div class="card">

<h2>👥 5 THÀNH VIÊN</h2>

<script>
const positions = `
<option value="">-- Chọn vị trí --</option>
<option value="Tank">Tank</option>
<option value="SP">SP</option>
<option value="Tỉa">Tỉa</option>
<option value="Bomber">Bomber</option>
<option value="Dự bị">Dự bị</option>
`;

for (let i = 1; i <= 5; i++) {

  document.write(`
    <div class="member">

      <h3>THÀNH VIÊN ${i}</h3>

      <label>Tên ingame</label>

      <input
        type="text"
        name="player${i}"
        placeholder="Tên ingame"
        required
      >

      <label>UID</label>

      <input
        type="text"
        name="uid${i}"
        placeholder="UID"
        required
      >

      <label>Vị trí</label>

      <select name="role${i}" required>
        ${positions}
      </select>

    </div>
  `);

}
</script>

</div>

<button
  type="submit"
  id="submitButton">

  🚀 ĐĂNG KÝ GIẢI ĐẤU

</button>

</form>

<div id="success"
     class="message success">

<h2>✅ ĐĂNG KÝ THÀNH CÔNG!</h2>

<p>Team của bạn đã được ghi nhận.</p>

</div>

<div id="error"
     class="message error">

<h2>❌ CÓ LỖI</h2>

<p id="errorText"></p>

</div>

<div class="footer">
CUSTOM EM BIN © 2026
</div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz2lA4EJL4zRHw4G-i-7jPP9axNYfBXzf_wxTIz773v_jzo473gFEOx4rluHD_92Rrz/exec";

const MAX_TEAMS = 24;

const form =
document.getElementById("registerForm");

const button =
document.getElementById("submitButton");

const counter =
document.getElementById("counter");

async function checkTeams() {

  try {

    const response =
      await fetch(SCRIPT_URL + "?t=" + Date.now());

    const result =
      await response.json();

    const count =
      Number(result.count || 0);

    counter.textContent =
      count + " / " + MAX_TEAMS + " TEAM";

    if (count >= MAX_TEAMS) {

      counter.textContent =
        "🔴 ĐÃ ĐỦ 24 / 24 TEAM";

      counter.classList.add("full");

      button.disabled = true;

      button.textContent =
        "🔒 ĐĂNG KÝ ĐÃ ĐÓNG";

    } else {

      counter.classList.remove("full");

      button.disabled = false;

      button.textContent =
        "🚀 ĐĂNG KÝ GIẢI ĐẤU";

    }

  } catch (error) {

    counter.textContent =
      "Không thể kiểm tra";

  }

}

form.addEventListener(
"submit",
async function(event) {

  event.preventDefault();

  button.disabled = true;

  button.textContent =
    "⏳ ĐANG GỬI...";

  const formData =
    new FormData(form);

  const data = {};

  formData.forEach(
    (value, key) => {
      data[key] = value;
    }
  );

  try {

    await fetch(
      SCRIPT_URL,
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      }
    );

    form.reset();

    document
      .getElementById("success")
      .style.display = "block";

    document
      .getElementById("error")
      .style.display = "none";

    await new Promise(
      resolve => setTimeout(resolve, 1200)
    );

    await checkTeams();

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

  } catch (error) {

    document
      .getElementById("error")
      .style.display = "block";

    document
      .getElementById("errorText")
      .textContent =
        "Không thể gửi đăng ký. Vui lòng thử lại.";

    button.disabled = false;

  }

});

checkTeams();

</script>

</body>
</html>
