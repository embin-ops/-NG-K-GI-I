<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Custom Em Bin - Đăng ký</title>

<style>
const SCRIPT_URL =
https://script.google.com/macros/s/ABC123/exec

    
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    background:
    linear-gradient(135deg, #070b14, #111827);

    color: white;

    min-height: 100vh;

    padding: 20px;
}

.container {

    max-width: 750px;

    margin: auto;
}

.header {

    text-align: center;

    padding: 25px 10px;
}

.header h1 {

    font-size: 34px;

    color: #00e5ff;

    margin-bottom: 8px;
}

.header p {

    color: #aaa;
}

.card {

    background: #151b2b;

    border: 1px solid #26324a;

    border-radius: 18px;

    padding: 22px;

    margin-bottom: 20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.35);
}

.card h2 {

    color: #00e5ff;

    margin-bottom: 20px;
}

label {

    display: block;

    font-weight: bold;

    margin-bottom: 7px;
}

input,
select {

    width: 100%;

    padding: 14px;

    margin-bottom: 17px;

    border-radius: 10px;

    border: 1px solid #303b55;

    background: #0c1220;

    color: white;

    font-size: 15px;

    outline: none;
}

input:focus,
select:focus {

    border-color: #00e5ff;
}

.member {

    background: #0e1524;

    border: 1px solid #2b3852;

    border-radius: 14px;

    padding: 17px;

    margin-bottom: 15px;
}

.member h3 {

    color: #ffd166;

    margin-bottom: 15px;
}

button {

    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 16px;

    background: #00e5ff;

    color: #001016;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

button:disabled {

    opacity: .5;

    cursor: not-allowed;
}

.message {

    display: none;

    padding: 18px;

    margin-top: 20px;

    border-radius: 12px;

    text-align: center;
}

.success {

    background: #12351f;

    border: 1px solid #28d66b;

    color: #8cffae;
}

.error {

    background: #3a1515;

    border: 1px solid #ff5555;

    color: #ff9a9a;
}

.footer {

    text-align: center;

    color: #666;

    margin-top: 25px;

    font-size: 13px;
}

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    .header h1 {
        font-size: 27px;
    }

    .card {
        padding: 16px;
    }
}

</style>

</head>


<body>

<div class="container">

<div class="header">

<h1>🏆 CUSTOM EM BIN</h1>

<p>ĐĂNG KÝ GIẢI ĐẤU</p>

</div>


<form id="registerForm">


<!-- THÔNG TIN TEAM -->

<div class="card">

<h2>📝 THÔNG TIN ĐỘI</h2>

<label>Tên Team</label>

<input
type="text"
name="teamName"
placeholder="Nhập tên team"
required
>


<label>Tên đội trưởng</label>

<input
type="text"
name="captain"
placeholder="Nhập tên đội trưởng"
required
>


<label>Số điện thoại / Zalo</label>

<input
type="text"
name="contact"
placeholder="Nhập SĐT hoặc Zalo"
required
>

</div>


<!-- THÀNH VIÊN -->

<div class="card">

<h2>👥 5 THÀNH VIÊN</h2>


<!-- PLAYER 1 -->

<div class="member">

<h3>THÀNH VIÊN 1</h3>

<label>Tên ingame</label>

<input
type="text"
name="player1"
placeholder="Tên ingame"
required
>

<label>UID</label>

<input
type="text"
name="uid1"
placeholder="UID"
required
>

<label>Vị trí</label>

<select name="role1" required>

<option value="">-- Chọn vị trí --</option>

<option>Tank</option>

<option>SP</option>

<option>Tỉa</option>

<option>Bomber</option>

<option>Dự bị</option>

</select>

</div>


<!-- PLAYER 2 -->

<div class="member">

<h3>THÀNH VIÊN 2</h3>

<label>Tên ingame</label>

<input
type="text"
name="player2"
placeholder="Tên ingame"
required
>

<label>UID</label>

<input
type="text"
name="uid2"
placeholder="UID"
required
>

<label>Vị trí</label>

<select name="role2" required>

<option value="">-- Chọn vị trí --</option>

<option>Tank</option>

<option>SP</option>

<option>Tỉa</option>

<option>Bomber</option>

<option>Dự bị</option>

</select>

</div>


<!-- PLAYER 3 -->

<div class="member">

<h3>THÀNH VIÊN 3</h3>

<label>Tên ingame</label>

<input
type="text"
name="player3"
placeholder="Tên ingame"
required
>

<label>UID</label>

<input
type="text"
name="uid3"
placeholder="UID"
required
>

<label>Vị trí</label>

<select name="role3" required>

<option value="">-- Chọn vị trí --</option>

<option>Tank</option>

<option>SP</option>

<option>Tỉa</option>

<option>Bomber</option>

<option>Dự bị</option>

</select>

</div>


<!-- PLAYER 4 -->

<div class="member">

<h3>THÀNH VIÊN 4</h3>

<label>Tên ingame</label>

<input
type="text"
name="player4"
placeholder="Tên ingame"
required
>

<label>UID</label>

<input
type="text"
name="uid4"
placeholder="UID"
required
>

<label>Vị trí</label>

<select name="role4" required>

<option value="">-- Chọn vị trí --</option>

<option>Tank</option>

<option>SP</option>

<option>Tỉa</option>

<option>Bomber</option>

<option>Dự bị</option>

</select>

</div>


<!-- PLAYER 5 -->

<div class="member">

<h3>THÀNH VIÊN 5</h3>

<label>Tên ingame</label>

<input
type="text"
name="player5"
placeholder="Tên ingame"
required
>

<label>UID</label>

<input
type="text"
name="uid5"
placeholder="UID"
required
>

<label>Vị trí</label>

<select name="role5" required>

<option value="">-- Chọn vị trí --</option>

<option>Tank</option>

<option>SP</option>

<option>Tỉa</option>

<option>Bomber</option>

<option>Dự bị</option>

</select>

</div>

</div>


<button
type="submit"
id="submitButton">

🚀 ĐĂNG KÝ GIẢI ĐẤU

</button>

</form>


<div
id="success"
class="message success">

<h2>✅ ĐĂNG KÝ THÀNH CÔNG!</h2>

<p>Thông tin đội đã được gửi.</p>

</div>


<div
id="error"
class="message error">

<h2>❌ CÓ LỖI</h2>

<p id="errorText">
Không thể gửi đăng ký.
</p>

</div>


<div class="footer">

CUSTOM EM BIN © 2026

</div>

</div>


<script>


/*
================================================
DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
================================================
*/

const SCRIPT_URL =
"https://script.google.com/macros/s/XXXXXXXXXXXX/exec";


const form =
document.getElementById("registerForm");

const button =
document.getElementById("submitButton");


form.addEventListener(
"submit",
async function(event) {

event.preventDefault();


button.disabled = true;

button.innerText =
"⏳ ĐANG GỬI ĐĂNG KÝ...";


const formData =
new FormData(form);


const data = {

teamName:
formData.get("teamName"),

captain:
formData.get("captain"),

contact:
formData.get("contact"),


player1:
formData.get("player1"),

uid1:
formData.get("uid1"),

role1:
formData.get("role1"),


player2:
formData.get("player2"),

uid2:
formData.get("uid2"),

role2:
formData.get("role2"),


player3:
formData.get("player3"),

uid3:
formData.get("uid3"),

role3:
formData.get("role3"),


player4:
formData.get("player4"),

uid4:
formData.get("uid4"),

role4:
formData.get("role4"),


player5:
formData.get("player5"),

uid5:
formData.get("uid5"),

role5:
formData.get("role5")

};


try {

await fetch(
SCRIPT_URL,
{

method: "POST",

mode: "no-cors",

headers: {
"Content-Type":
"text/plain;charset=utf-8"
},

body:
JSON.stringify(data)

});


document
.getElementById("success")
.style.display = "block";


form.reset();


window.scrollTo({

top:
document.body.scrollHeight,

behavior:
"smooth"

});


}

catch(error) {

document
.getElementById("error")
.style.display = "block";


document
.getElementById("errorText")
.innerText =
"Không thể gửi dữ liệu. Vui lòng thử lại.";

}


button.disabled = false;

button.innerText =
"🚀 ĐĂNG KÝ GIẢI ĐẤU";

});


</script>

</body>

</html>
